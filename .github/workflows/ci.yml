name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m py_compile dreamhost-ddns.py

      # Mock DreamHost, IP-lookup and DNS servers; no network or credentials.
      - run: python -W error -m unittest discover -s tests -v

  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The units' ExecStart must exist and be executable for verify to pass.
      - name: Install the script where the unit expects it
        run: sudo install -m 0755 dreamhost-ddns.py /usr/local/sbin/dreamhost-ddns

      - run: systemd-analyze verify systemd/dreamhost-ddns.service systemd/dreamhost-ddns.timer
